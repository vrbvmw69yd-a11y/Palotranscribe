name: TataMed live PaloTranscribe verification

on:
  push:
    branches: [live-tatamed-verification]

concurrency:
  group: tatamed-live-palotranscribe
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - model_index: 0
            model_name: Rapido
            max_wait_ms: 300000
          - model_index: 1
            model_name: Recomendado
            max_wait_ms: 420000
          - model_index: 2
            model_name: Pro
            max_wait_ms: 600000
    name: ${{ matrix.model_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install browser test runtime
        run: |
          bun add --dev playwright@1.55.0 --no-save
          bunx playwright install --with-deps chromium
      - name: Generate real Spanish WAV
        run: |
          sudo apt-get update
          sudo apt-get install -y espeak
          espeak -v es -s 135 "Hola mundo. Esta es una prueba de transcripción médica. Glasgow, ceftriaxona y CENETEC." -w /tmp/palotranscribe-test.wav
          test -s /tmp/palotranscribe-test.wav
      - name: Wait briefly for Lovable production propagation
        run: sleep 20
      - name: Upload, transcribe, verify progress and download
        env:
          MODEL_INDEX: ${{ matrix.model_index }}
          MODEL_NAME: ${{ matrix.model_name }}
          MAX_WAIT_MS: ${{ matrix.max_wait_ms }}
        run: bun .github/scripts/tatamed-live-e2e.mjs
